upstream notes_backend { server backend:8000; }
upstream notes_frontend { server frontend:8080; }
server {
    listen 8080;
    server_name localhost;
    location / { proxy_pass http://notes_frontend; }
    location /api/ { proxy_pass http://notes_backend; }
    location = /health { proxy_pass http://notes_backend; }
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
}

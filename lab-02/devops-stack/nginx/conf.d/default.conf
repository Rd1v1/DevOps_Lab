upstream notes_backend { server backend:8000; keepalive 32; }
upstream notes_frontend { server frontend:8080; }

server {
    listen 8080;
    server_name devops-stack.local localhost;
    return 301 https://$host:${HTTPS_PORT}$request_uri;
}
server {
    listen 8443 ssl;
    server_name devops-stack.local localhost;
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    location / { proxy_pass http://notes_frontend; }
    location /api/ {
        proxy_pass http://notes_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    location = /health { proxy_pass http://notes_backend; }
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
}

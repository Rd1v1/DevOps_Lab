# Explicit opt-in: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  backend:
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
  nginx:
    ports: !override ["127.0.0.1:${HTTP_PORT:-8088}:8080"]
    volumes:
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
